<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4ccd6"/>
      <stop offset="55%" stop-color="#d8d0c4"/>
      <stop offset="100%" stop-color="#d0c8b8"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dedad4"/>
      <stop offset="100%" stop-color="#c8c4bc"/>
    </linearGradient>
    <linearGradient id="earth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8a888"/>
      <stop offset="100%" stop-color="#a09074"/>
    </linearGradient>
    <linearGradient id="rammedearth" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6e6050"/>
      <stop offset="100%" stop-color="#7a6c5c"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- Distant Andes mountain range -->
  <polygon points="0,490 180,210 340,370 510,190 680,330 850,170 1020,295 1190,205 1380,290 1550,210 1600,230 1600,490" fill="url(#mountain)"/>
  <!-- Snow caps -->
  <polygon points="510,190 544,212 476,210" fill="#f0ede8"/>
  <polygon points="850,170 888,198 812,195" fill="#eceae6"/>
  <polygon points="1190,205 1222,228 1158,226" fill="#f0ede8"/>
  <!-- Mid-ground hills -->
  <rect x="0" y="490" width="1600" height="410" fill="url(#earth)"/>
  <!-- Vineyard terrace lines -->
  <line x1="0" y1="516" x2="1600" y2="516" stroke="#8c7c60" stroke-width="2.2" opacity="0.5"/>
  <line x1="0" y1="546" x2="1600" y2="546" stroke="#8c7c60" stroke-width="2.2" opacity="0.48"/>
  <line x1="0" y1="578" x2="1600" y2="578" stroke="#8c7c60" stroke-width="2" opacity="0.44"/>
  <line x1="0" y1="614" x2="1600" y2="614" stroke="#8c7c60" stroke-width="2" opacity="0.40"/>
  <line x1="0" y1="654" x2="1600" y2="654" stroke="#8c7c60" stroke-width="2" opacity="0.36"/>
  <line x1="0" y1="698" x2="1600" y2="698" stroke="#8c7c60" stroke-width="2" opacity="0.32"/>
  <line x1="0" y1="748" x2="1600" y2="748" stroke="#8c7c60" stroke-width="1.5" opacity="0.28"/>
  <!-- Vine posts along terraces -->
  <circle cx="80" cy="516" r="3" fill="#68583c" opacity="0.65"/>
  <circle cx="180" cy="516" r="3" fill="#68583c" opacity="0.65"/>
  <circle cx="280" cy="516" r="3" fill="#68583c" opacity="0.65"/>
  <circle cx="380" cy="516" r="3" fill="#68583c" opacity="0.65"/>
  <circle cx="480" cy="516" r="3" fill="#68583c" opacity="0.65"/>
  <circle cx="580" cy="516" r="3" fill="#68583c" opacity="0.65"/>
  <circle cx="680" cy="516" r="3" fill="#68583c" opacity="0.65"/>
  <circle cx="780" cy="516" r="3" fill="#68583c" opacity="0.65"/>
  <circle cx="880" cy="516" r="3" fill="#68583c" opacity="0.65"/>
  <circle cx="980" cy="516" r="3" fill="#68583c" opacity="0.65"/>
  <circle cx="1080" cy="516" r="3" fill="#68583c" opacity="0.65"/>
  <circle cx="1180" cy="516" r="3" fill="#68583c" opacity="0.65"/>
  <circle cx="1280" cy="516" r="3" fill="#68583c" opacity="0.65"/>
  <circle cx="1380" cy="516" r="3" fill="#68583c" opacity="0.65"/>
  <circle cx="1480" cy="516" r="3" fill="#68583c" opacity="0.65"/>
  <circle cx="80" cy="546" r="3" fill="#68583c" opacity="0.55"/>
  <circle cx="180" cy="546" r="3" fill="#68583c" opacity="0.55"/>
  <circle cx="280" cy="546" r="3" fill="#68583c" opacity="0.55"/>
  <circle cx="380" cy="546" r="3" fill="#68583c" opacity="0.55"/>
  <circle cx="480" cy="546" r="3" fill="#68583c" opacity="0.55"/>
  <circle cx="580" cy="546" r="3" fill="#68583c" opacity="0.55"/>
  <circle cx="680" cy="546" r="3" fill="#68583c" opacity="0.55"/>
  <circle cx="780" cy="546" r="3" fill="#68583c" opacity="0.55"/>
  <circle cx="880" cy="546" r="3" fill="#68583c" opacity="0.55"/>
  <circle cx="980" cy="546" r="3" fill="#68583c" opacity="0.55"/>
  <!-- Winery building — rammed earth embedded in slope -->
  <rect x="290" y="442" width="1020" height="78" fill="url(#rammedearth)"/>
  <!-- Rammed earth strata lines -->
  <line x1="290" y1="456" x2="1310" y2="456" stroke="#5a4e3e" stroke-width="1.2" opacity="0.65"/>
  <line x1="290" y1="469" x2="1310" y2="469" stroke="#5a4e3e" stroke-width="1.2" opacity="0.60"/>
  <line x1="290" y1="482" x2="1310" y2="482" stroke="#5a4e3e" stroke-width="1.2" opacity="0.55"/>
  <line x1="290" y1="495" x2="1310" y2="495" stroke="#5a4e3e" stroke-width="1.2" opacity="0.55"/>
  <line x1="290" y1="508" x2="1310" y2="508" stroke="#5a4e3e" stroke-width="1.2" opacity="0.5"/>
  <!-- Roof slab -->
  <rect x="278" y="428" width="1044" height="16" fill="#2e2820"/>
  <!-- Tasting room cantilever (right end, toward mountains) -->
  <rect x="900" y="388" width="410" height="54" fill="#524c46"/>
  <rect x="888" y="376" width="434" height="16" fill="#242018"/>
  <!-- Tasting room full-width glass -->
  <rect x="908" y="392" width="394" height="38" fill="#c4d0d8" fill-opacity="0.42" stroke="#8898a4" stroke-width="0.8"/>
  <!-- Framing mullions -->
  <line x1="1020" y1="392" x2="1020" y2="430" stroke="#8898a4" stroke-width="0.8" opacity="0.5"/>
  <line x1="1130" y1="392" x2="1130" y2="430" stroke="#8898a4" stroke-width="0.8" opacity="0.5"/>
  <line x1="1240" y1="392" x2="1240" y2="430" stroke="#8898a4" stroke-width="0.8" opacity="0.5"/>
  <!-- Main volume windows -->
  <rect x="330" y="450" width="130" height="42" fill="#c4c8c4" fill-opacity="0.3" stroke="#8c8c88" stroke-width="0.8"/>
  <rect x="490" y="450" width="90" height="42" fill="#c4c8c4" fill-opacity="0.26" stroke="#8c8c88" stroke-width="0.8"/>
  <!-- Cellar entrance (dark opening) -->
  <rect x="700" y="456" width="60" height="64" fill="#2a2420"/>
</svg>

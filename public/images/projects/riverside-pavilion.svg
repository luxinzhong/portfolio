<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ddd8d0"/>
      <stop offset="100%" stop-color="#c8c0b4"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b4b0aa"/>
      <stop offset="100%" stop-color="#9a9690"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- Distant treeline -->
  <rect x="0" y="500" width="1600" height="44" fill="#b0a898" opacity="0.45"/>
  <!-- Water -->
  <rect y="540" width="1600" height="360" fill="url(#water)"/>
  <line x1="0" y1="560" x2="1600" y2="560" stroke="#c4c0bc" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="582" x2="1600" y2="582" stroke="#c4c0bc" stroke-width="0.8" opacity="0.3"/>
  <line x1="0" y1="610" x2="1600" y2="610" stroke="#c4c0bc" stroke-width="0.7" opacity="0.22"/>
  <line x1="0" y1="644" x2="1600" y2="644" stroke="#c4c0bc" stroke-width="0.6" opacity="0.18"/>
  <!-- Deck/base -->
  <rect x="150" y="528" width="1300" height="16" fill="#3c3830"/>
  <!-- Roof -->
  <rect x="130" y="286" width="1340" height="22" fill="#2c2824"/>
  <rect x="130" y="308" width="1340" height="8" fill="#1a1714" opacity="0.28"/>
  <!-- Columns -->
  <rect x="218" y="308" width="10" height="220" fill="#2c2824"/>
  <rect x="438" y="308" width="10" height="220" fill="#2c2824"/>
  <rect x="658" y="308" width="10" height="220" fill="#2c2824"/>
  <rect x="878" y="308" width="10" height="220" fill="#2c2824"/>
  <rect x="1098" y="308" width="10" height="220" fill="#2c2824"/>
  <rect x="1318" y="308" width="10" height="220" fill="#2c2824"/>
  <!-- Glass bays -->
  <rect x="228" y="326" width="210" height="202" fill="#c8c4be" fill-opacity="0.22" stroke="#9a9690" stroke-width="0.8"/>
  <rect x="448" y="326" width="210" height="202" fill="#c8c4be" fill-opacity="0.30" stroke="#9a9690" stroke-width="0.8"/>
  <rect x="668" y="326" width="210" height="202" fill="#e8d8b8" fill-opacity="0.18" stroke="#9a9690" stroke-width="0.8"/>
  <rect x="888" y="326" width="210" height="202" fill="#c8c4be" fill-opacity="0.26" stroke="#9a9690" stroke-width="0.8"/>
  <rect x="1108" y="326" width="210" height="202" fill="#c8c4be" fill-opacity="0.20" stroke="#9a9690" stroke-width="0.8"/>
  <!-- Interior warm glow (one lit bay) -->
  <rect x="448" y="326" width="210" height="202" fill="#e8d4a0" fill-opacity="0.12"/>
  <!-- Water reflections -->
  <rect x="130" y="544" width="1340" height="6" fill="#2c2824" opacity="0.18"/>
  <rect x="218" y="544" width="10" height="88" fill="#2c2824" opacity="0.13"/>
  <rect x="438" y="544" width="10" height="96" fill="#2c2824" opacity="0.13"/>
  <rect x="658" y="544" width="10" height="82" fill="#2c2824" opacity="0.13"/>
  <rect x="878" y="544" width="10" height="90" fill="#2c2824" opacity="0.13"/>
  <rect x="1098" y="544" width="10" height="86" fill="#2c2824" opacity="0.13"/>
  <rect x="1318" y="544" width="10" height="92" fill="#2c2824" opacity="0.13"/>
</svg>
